# Veille Kraken. Modifie les pairs, puis : systemctl --user restart kraken-alerts
# Données publiques uniquement. Aucun ordre n'est passé.

poll_seconds = 60
short_refresh_seconds = 300
long_refresh_seconds = 1800
urgent_move_pct = 4.0
price_cooldown_seconds = 1200
bias_cooldown_seconds = 7200
quiet_start = "23:00"
quiet_end = "08:00"
digest_hour = "08:00"

# market : Spot, Futures, Forex, Action tokenisée
# engine : spot (défaut) ou futures
# below / above : seuil franchi une seule fois

[[pair]]
symbol = "BTCUSD"
label = "BTC"
market = "Spot"
price_move_pct = 1.2
below = [70000]

[[pair]]
symbol = "ETHUSD"
label = "ETH"
market = "Spot"
price_move_pct = 1.5

[[pair]]
symbol = "SOLUSD"
label = "SOL"
market = "Spot"
price_move_pct = 2.0
above = [120]

[[pair]]
symbol = "PF_XBTUSD"
label = "BTC perp"
market = "Futures"
engine = "futures"
price_move_pct = 1.2

[[pair]]
symbol = "AAPLx/USD"
label = "AAPL"
market = "Action tokenisée"
asset_class = "tokenized_asset"
price_move_pct = 1.5
